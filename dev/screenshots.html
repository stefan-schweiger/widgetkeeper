<!DOCTYPE html>
<html class="homey-dark-mode">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget screenshots</title>
  <!--
    The README screenshots: the real widget code with mock data, at the width of a widget on Homey's dark dashboard
    on a phone (358 px: a 390 px screen less the dashboard's 16 px margins; colours sampled from an iPhone screenshot).
    No widget title and a transparent page, so the shots sit flush with the README text in either GitHub theme. `?s=electricity|thermostat|quickactions|sensoralarms|sensordots|weather|heatmap|cameras|values|sparklines|variables|flows|price|timers|locks|curtains`
    shows one, for scripts/render-screenshots.mjs; without it, all of them. The widgets are mounted by mock-dashboard.js with the made-up home of showcase-data.js.
    Device icons come from Homey's icon library. The render script downloads them to temp/screenshot-icons.js;
    without that file the tiles fall back to plain squares.
  -->
  <script src="fixed-clock.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/electricity/public/widget.css">
  <link rel="stylesheet" href="../widgets/thermostat/public/widget.css">
  <link rel="stylesheet" href="../widgets/quickactions/public/widget.css">
  <link rel="stylesheet" href="../widgets/sensoralarms/public/widget.css">
  <link rel="stylesheet" href="../widgets/sensordots/public/widget.css">
  <link rel="stylesheet" href="../widgets/weather/public/widget.css">
  <link rel="stylesheet" href="../widgets/heatmap/public/widget.css">
  <link rel="stylesheet" href="../widgets/cameras/public/widget.css">
  <link rel="stylesheet" href="../widgets/values/public/widget.css">
  <link rel="stylesheet" href="../widgets/variables/public/widget.css">
  <link rel="stylesheet" href="../widgets/flows/public/widget.css">
  <link rel="stylesheet" href="../widgets/price/public/widget.css">
  <link rel="stylesheet" href="../widgets/timers/public/widget.css">
  <link rel="stylesheet" href="../widgets/locks/public/widget.css">
  <link rel="stylesheet" href="../widgets/curtains/public/widget.css">
  <link rel="stylesheet" href="../widgets/sparklines/public/widget.css">
  <script src="../widgets/electricity/public/widget.js"></script>
  <script src="../widgets/thermostat/public/widget.js"></script>
  <script src="../widgets/quickactions/public/widget.js"></script>
  <script src="../widgets/sensoralarms/public/widget.js"></script>
  <script src="../widgets/sensordots/public/widget.js"></script>
  <script src="../widgets/weather/public/widget.js"></script>
  <script src="../widgets/heatmap/public/widget.js"></script>
  <script src="../widgets/cameras/public/widget.js"></script>
  <script src="../widgets/values/public/widget.js"></script>
  <script src="../widgets/variables/public/widget.js"></script>
  <script src="../widgets/flows/public/widget.js"></script>
  <script src="../widgets/price/public/widget.js"></script>
  <script src="../widgets/timers/public/widget.js"></script>
  <script src="../widgets/locks/public/widget.js"></script>
  <script src="../widgets/curtains/public/widget.js"></script>
  <script src="../widgets/sparklines/public/widget.js"></script>
  <script src="../temp/screenshot-icons.js" onerror="window.ICONS = {}"></script>
  <script src="mock-util.js"></script>
  <script src="showcase-data.js"></script>
  <script src="showcase-mount.js"></script>
  <style>
    /* Transparent: the render script screenshots with a transparent default background. */
    html, body { background: transparent !important; }
    body { width: 358px; margin: 0; font-family: Roboto, sans-serif; display: flex; flex-direction: column; gap: 32px; }
    .shot[hidden] { display: none; }
    /* A non-transparent widget's frame (default widget background, with Homey's widget padding). */
    .card { background: #1F2029; border-radius: 20px; padding: 16px; box-sizing: border-box; }
    .card.tw-frame, .card.wf-frame, .card.hm-frame { background: #181920; }
  </style>
</head>
<body>
  <section class="shot" id="electricity"><div class="card"><div id="w-elec"></div></div></section>
  <section class="shot" id="thermostat"><div class="card tw-frame"><div id="w-thermo"></div></div></section>
  <section class="shot" id="quickactions"><div id="w-qa"></div></section>
  <section class="shot" id="sensoralarms"><div id="w-sa"></div></section>
  <section class="shot" id="weather"><div class="card wf-frame"><div id="w-weather"></div></div></section>
  <section class="shot" id="heatmap"><div class="card hm-frame"><div id="w-heatmap"></div></div></section>
  <section class="shot" id="cameras"><div id="w-cameras"></div></section>
  <section class="shot" id="values"><div id="w-values"></div></section>
  <section class="shot" id="variables"><div id="w-variables"></div></section>
  <section class="shot" id="flows"><div id="w-flows"></div></section>
  <section class="shot" id="price"><div id="w-price"></div></section>
  <section class="shot" id="locks"><div id="w-locks"></div></section>
  <section class="shot" id="sparklines"><div id="w-sparklines"></div></section>

  <script src="mock-dashboard.js"></script>
  <script>
    // One shot alone; its height goes on <body> for the render script.
    const only = new URLSearchParams(location.search).get('s');
    if (only) for (const s of document.querySelectorAll('.shot')) s.hidden = s.id !== only;
    document.fonts.ready.then(() => {
      document.body.dataset.height = String(Math.ceil(document.body.getBoundingClientRect().height));
    });
  </script>
</body>
</html>
