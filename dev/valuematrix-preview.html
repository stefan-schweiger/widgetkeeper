<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Value Matrix widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/valuematrix/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/valuematrix/public/widget.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    /* The widget is transparent: it sits straight on the dashboard background. */
    .dash { padding: 0; box-sizing: border-box; }
    .light { background: #F2F3F5; padding: 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · rooms</span><div class="dash homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · dark · Vivid</span><div class="dash homey-dark-mode" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>358 px · light</span><div class="dash light" style="width:358px"><div id="w3"></div></div></div>
  <div class="col"><span>358 px · light · Vivid</span><div class="dash light" style="width:358px"><div id="w4"></div></div></div>
  <div class="col"><span>300 px · dark · six columns</span><div class="dash homey-dark-mode" style="width:300px"><div id="w5"></div></div></div>
  <div class="col"><span>420 px (a tablet column) · dark · devices, no legend</span><div class="dash homey-dark-mode" style="width:420px"><div id="w6"></div></div></div>
  <div class="col"><span>358 px · power (no range), headers typed, an unavailable device</span><div class="dash homey-dark-mode" style="width:358px"><div id="w7"></div></div></div>
  <div class="col"><span>358 px · no values picked</span><div class="dash homey-dark-mode" style="width:358px"><div id="w8"></div></div></div>

  <script>
    // Made-up rooms. `?lang=de` for a language.
    const Z = {
      living: { id: 'living', name: 'Living room' }, kitchen: { id: 'kitchen', name: 'Kitchen' }, bed: { id: 'bed', name: 'Bedroom' },
      bath: { id: 'bath', name: 'Bathroom' }, emma: { id: 'emma', name: "Emma's room" }, office: { id: 'office', name: 'Office' },
    };
    const T = 'measure_temperature', H = 'measure_humidity', C = 'measure_co2', R = 'measure_radon', P = 'measure_pm25', V = 'measure_voc';
    const DESCRIBED = {
      [T]: { capabilityId: T, title: 'Temperature', units: '°C', decimals: 1 },
      [H]: { capabilityId: H, title: 'Humidity', units: '%', decimals: 0 },
      [C]: { capabilityId: C, title: 'CO2', units: 'ppm', decimals: 0 },
      [R]: { capabilityId: R, title: 'Radon', units: 'Bq/m³', decimals: 0 },
      [P]: { capabilityId: P, title: 'PM2.5', units: 'μg/m³', decimals: 0 },
      [V]: { capabilityId: V, title: 'VOC', units: 'ppb', decimals: 0 },
      measure_power: { capabilityId: 'measure_power', title: 'Power', units: 'W', decimals: 0 },
      measure_battery: { capabilityId: 'measure_battery', title: 'Battery', units: '%', decimals: 0 },
    };
    const device = (id, zone, name, values) => ({ id, name, zone, values });
    const house = () => [
      device('l1', Z.living, 'Airthings View', { [T]: 21.4, [H]: 44, [C]: 720, [P]: 4, [V]: 214 }),
      device('k1', Z.kitchen, 'Air monitor', { [T]: 21.9, [H]: 64, [V]: 1290 }),
      device('b1', Z.bed, 'Bedroom sensor', { [T]: 18.2, [H]: 52 }),
      device('b2', Z.bed, 'Airthings Wave', { [C]: 960, [R]: 48 }),
      device('ba', Z.bath, 'Bathroom sensor', { [T]: 22.8, [H]: 72 }),
      device('e1', Z.emma, 'Emma sensor', { [T]: 20.6, [H]: 48, [C]: 1640 }),
      device('o1', Z.office, 'Radon sensor', { [T]: 19.4, [H]: 41, [R]: 162 }),
    ];
    const cols = ids => ids.map(capabilityId => ({ capabilityId }));
    const make = (id, devices, opts = {}) => {
      const w = createValueMatrixWidget(document.getElementById(id), { t: devT, ...opts });
      const ids = (opts.columns || []).map(c => c.capabilityId);
      if (devices) w.setState({ columns: ids.map(c => DESCRIBED[c] || null), devices });
      return w;
    };
    const four = cols([T, H, C, R]);
    const widgets = [
      make('w1', house(), { columns: four }),
      make('w2', house(), { columns: four, colorStyle: 'deep' }),
      make('w3', house(), { columns: four }),
      make('w4', house(), { columns: four, colorStyle: 'deep' }),
      make('w5', house(), { columns: cols([T, H, C, R, P, V]) }),
      make('w6', house(), { columns: four, rows: 'devices', showLegend: false }),
    ];
    make('w7', [
      device('p1', Z.kitchen, 'Dishwasher', { measure_power: 1840, measure_battery: null }),
      device('p2', Z.living, 'TV', { measure_power: 96 }),
      device('p3', Z.office, 'Lamp sensor', { measure_battery: 12 }),
      { id: 'gone', missing: true },
    ], { rows: 'devices', columns: [{ capabilityId: 'measure_power', header: 'Watt' }, { capabilityId: 'measure_battery', range: '>20' }] });
    const empty = make('w8', null);
    empty.setMessage(empty.t('selectColumns'));
    // Simulate the bedroom getting stuffier, then aired out.
    let co2 = 960;
    setInterval(() => {
      co2 = co2 >= 1700 ? 700 : co2 + 100;
      for (const w of widgets) w.pushChange({ deviceId: 'b2', capabilityId: C, value: co2 });
    }, 2000);
  </script>
</body>
</html>
