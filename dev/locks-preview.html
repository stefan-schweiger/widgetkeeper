<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locks widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/locks/public/widget.css">
  <script src="../widgets/locks/public/widget.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { background: #111217; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    /* The widget is transparent: it sits straight on the dashboard background. */
    .dash { padding: 0; box-sizing: border-box; }
    .light { background: #F2F3F5; padding: 12px; border-radius: 12px;
      --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col > span { color: #9C9DA5; font: 12px Roboto, sans-serif; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · all secure</span><div class="dash homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · dark · one unlocked</span><div class="dash homey-dark-mode" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>358 px · dark · two not secure, list open</span><div class="dash homey-dark-mode" style="width:358px"><div id="w3"></div></div></div>
  <div class="col"><span>358 px · light · two not secure, list open</span><div class="dash light" style="width:358px"><div id="w4"></div></div></div>
  <div class="col"><span>358 px · light · all secure, list, unlocking allowed</span><div class="dash light" style="width:358px"><div id="w5"></div></div></div>
  <div class="col"><span>300 px · dark · list, one gone</span><div class="dash homey-dark-mode" style="width:300px"><div id="w6"></div></div></div>
  <div class="col"><span>358 px · dark · doors only</span><div class="dash homey-dark-mode" style="width:358px"><div id="w7"></div></div></div>
  <div class="col"><span>358 px · no devices</span><div class="dash homey-dark-mode" style="width:358px"><div id="w8"></div></div></div>

  <script>
    // Made-up devices; a simulated Homey that reports a lock's new state 1.5 s after it's set.
    const now = Date.now();
    const ago = min => now - min * 60e3;
    const cap = (value, setable, min) => ({ value, setable, lastUpdated: ago(min) });
    const devices = (frontLocked, backLocked, garageClosed) => [
      { id: 'front', name: 'Front door', icon: null, caps: { locked: cap(frontLocked, true, 42), alarm_contact: cap(false, false, 44) } },
      { id: 'back', name: 'Back door', icon: null, caps: { locked: cap(backLocked, true, 18) } },
      { id: 'garage', name: 'Garage', icon: null, caps: { garagedoor_closed: cap(garageClosed, true, 95) } },
      { id: 'window', name: 'Bedroom window', icon: null, caps: { alarm_contact: cap(false, false, 300) } },
    ];
    function mount(id, list, opts = {}) {
      let w;
      w = createLocksWidget(document.getElementById(id), {
        t: devT, ...opts,
        onSet: (deviceId, capabilityId, value) => new Promise((resolve) => setTimeout(() => {
          resolve();
          setTimeout(() => w.pushChange({ deviceId, capabilityId, value, t: Date.now() }), 1500);
        }, 300)),
      });
      w.setState({ devices: list, language: 'en' });
      return w;
    }
    mount('w1', devices(true, true, true));
    mount('w2', devices(true, false, true));
    mount('w3', devices(true, false, false)).expand();
    mount('w4', devices(true, false, false)).expand();
    mount('w5', devices(true, true, true), { view: 'list', allowUnlock: true });
    mount('w6', [...devices(false, true, true), { id: 'gone', missing: true }], { view: 'list' });
    mount('w7', devices(true, true, true).filter(d => !d.caps.locked));
    const empty = createLocksWidget(document.getElementById('w8'), { t: devT });
    empty.setMessage(empty.t('selectDevices'));
  </script>
</body>
</html>
