<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow buttons widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/flows/public/widget.css">
  <script src="../widgets/flows/public/widget.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { background: #111217; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    /* The widget is transparent: it sits straight on the dashboard background. */
    .dash { padding: 0; box-sizing: border-box; }
    .light { background: #F2F3F5; padding: 12px; border-radius: 12px;
      --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col > span { color: #9C9DA5; font: 12px Roboto, sans-serif; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · 1 column</span><div class="dash homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · light · 1 column</span><div class="dash light" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>358 px · dark · 2 columns</span><div class="dash homey-dark-mode" style="width:358px"><div id="w3"></div></div></div>
  <div class="col"><span>358 px · light · 2 columns</span><div class="dash light" style="width:358px"><div id="w4"></div></div></div>
  <div class="col"><span>300 px · dark · 2 columns</span><div class="dash homey-dark-mode" style="width:300px"><div id="w5"></div></div></div>
  <div class="col"><span>358 px · dark · every icon</span><div class="dash homey-dark-mode" style="width:358px"><div id="w6"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="dash homey-dark-mode" style="width:358px"><div id="w7"></div></div></div>

  <script>
    // Made-up flows; a simulated Homey that starts each one after 600 ms (and fails "Broken flow").
    const BUTTONS = [
      { id: 'flow:1', color: 'purple', icon: 'moon' },
      { id: 'advanced:2', color: 'orange', icon: 'tv' },
      { id: 'flow:3', color: 'blue', icon: 'leave' },
      { id: 'flow:4', color: 'yellow', icon: 'sun' },
      { id: 'flow:5', color: 'green', icon: 'home' },
      { id: 'flow:6', color: 'red', icon: 'shield' },
      { id: 'flow:7', color: 'grey', icon: 'power' },
      { id: 'flow:8' },
    ];
    const FLOWS = [
      { id: 'flow:1', name: 'Good night', enabled: true, triggerable: true, advanced: false },
      { id: 'advanced:2', name: 'Movie time in the living room, dim the lights and close the blinds', enabled: true, triggerable: true, advanced: true },
      { id: 'flow:3', name: 'Leaving home', enabled: true, triggerable: true, advanced: false },
      { id: 'flow:4', name: 'Good morning', enabled: true, triggerable: true, advanced: false },
      { id: 'flow:5', name: 'Holiday mode', enabled: false, triggerable: true, advanced: false },
      { id: 'flow:6', name: 'Broken flow', enabled: true, triggerable: true, advanced: false },
      { id: 'flow:7', name: 'Everything off', enabled: true, triggerable: true, advanced: false },
      { id: 'flow:8', missing: true },
    ];
    function mount(id, opts = {}, buttons = BUTTONS, flows = FLOWS) {
      const w = createFlowsWidget(document.getElementById(id), {
        t: devT, buttons, ...opts,
        onTrigger: (fid) => new Promise((resolve, reject) => setTimeout(() => {
          if (fid === 'flow:6') return reject(new Error('Simulated failure'));
          resolve();
        }, 600)),
      });
      w.setState(flows);
      return w;
    }
    mount('w1'); mount('w2');
    mount('w3', { columns: '2' }); mount('w4', { columns: '2' }); mount('w5', { columns: '2' });
    const colors = ['blue', 'red', 'orange', 'yellow', 'green', 'purple', 'grey'];
    const all = FLOW_BUTTON_ICONS.map((icon, i) => ({ id: `flow:i${i}`, icon, color: colors[i % colors.length] }));
    mount('w6', { columns: '2' }, all, all.map(b => ({ id: b.id, name: b.icon, enabled: true, triggerable: true, advanced: false })));
    const empty = createFlowsWidget(document.getElementById('w7'), { t: devT });
    empty.setMessage(empty.t('selectSlots'));
  </script>
</body>
</html>
