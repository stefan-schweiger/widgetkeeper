<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/media/public/widget.css">
  <script src="../widgets/media/public/widget.js"></script>
  <script src="mock-media.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { background: #111217; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col > span { color: #9C9DA5; font: 12px Roboto, sans-serif; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · playing</span><div class="card mw-frame homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · light · paused, shuffle and repeat</span><div class="card light" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>300 px · dark · TV, muted, max 40 %</span><div class="card mw-frame homey-dark-mode" style="width:300px"><div id="w3"></div></div></div>
  <div class="col"><span>358 px · dark · no art, nothing playing</span><div class="card mw-frame homey-dark-mode" style="width:358px"><div id="w4"></div></div></div>
  <div class="col"><span>358 px · dark · missing speaker</span><div class="card mw-frame homey-dark-mode" style="width:358px"><div id="w5"></div></div></div>
  <div class="col"><span>358 px · dark · nothing picked</span><div class="card mw-frame homey-dark-mode" style="width:358px"><div id="w6"></div></div></div>

  <script>
    const SOURCES = [{ id: 'card:tv', name: 'TV' }, { id: 'card:line', name: 'Line-in' }, { id: 'flow:movie', name: 'Movie night' }];
    mountMockMedia(document.getElementById('w1'), mockSpeaker('Kitchen', 0), { buttons: SOURCES, t: devT });
    mountMockMedia(document.getElementById('w2'), mockSpeaker('Living room', 1, { playing: false }), { showShuffle: true, t: devT });
    mountMockMedia(document.getElementById('w3'), mockSpeaker('TV', 2, { track: 'HDMI', muted: true, volume: 0.25 }),
      { buttons: SOURCES, maxVolume: 0.4, t: devT });
    mountMockMedia(document.getElementById('w4'), mockSpeaker('Bathroom', 0, { track: null, art: false, playing: false }), { t: devT });
    createMediaWidget(document.getElementById('w5'), { t: devT }).setState({ id: 'x', missing: true });
    const empty = createMediaWidget(document.getElementById('w6'), { t: devT });
    empty.setMessage(empty.t('selectDevice'));
  </script>
</body>
</html>
