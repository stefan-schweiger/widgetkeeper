<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web dashboards preview</title>
  <!--
    The web dashboards page (settings/dashboard.html) with a simulated app API: the front page, the editor and the
    device picker, on a made-up house. Serve the repo root (`python -m http.server 8765`) and open
    /dev/web-preview.html (`?lang=de`; the colour scheme follows the browser's). The widget frames stay empty: they
    need a Homey.
  -->
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../settings/dashboard.css">
  <script src="mock-web-api.js"></script>
  <script>
    (function () {
      const lang = new URLSearchParams(location.search).get('lang') || 'en';
      const icon = (name) => `https://my.homey.app/img/devices/${name}.svg`;

      // A made-up house: zones with a floor above the rooms, and devices in them.
      const zones = {
        gf: ['Ground floor', null], ff: ['First floor', null],
        living: ['Living room', 'gf'], kitchen: ['Kitchen', 'gf'], hall: ['Hallway', 'gf'],
        bed: ['Bedroom', 'ff'], kids: ['Kids\' room', 'ff'], bath: ['Bathroom', 'ff'], garden: ['Garden', null],
      };
      const D = (id, name, zone, cls, caps, ic) => ({ id, name, zone, class: cls, capabilities: caps, icon: icon(ic) });
      const LIGHT = ['onoff', 'dim'];
      const devices = [
        D('d1', 'Sofa lamp', 'living', 'light', LIGHT, 'light-bulb'),
        D('d2', 'Ceiling light', 'living', 'light', LIGHT, 'light-bulb'),
        D('d3', 'Reading light', 'living', 'light', LIGHT, 'light-bulb'),
        D('d4', 'TV backlight', 'living', 'light', LIGHT, 'light-bulb'),
        D('d5', 'Pendants', 'kitchen', 'light', LIGHT, 'light-bulb'),
        D('d6', 'Worktop lights', 'kitchen', 'light', LIGHT, 'light-bulb'),
        D('d7', 'Hall light', 'hall', 'light', LIGHT, 'light-bulb'),
        D('d8', 'Bedside left', 'bed', 'light', LIGHT, 'light-bulb'),
        D('d9', 'Bedside right', 'bed', 'light', LIGHT, 'light-bulb'),
        D('d10', 'Night light', 'kids', 'light', LIGHT, 'light-bulb'),
        D('d11', 'Mirror light', 'bath', 'light', LIGHT, 'light-bulb'),
        D('d12', 'Garden spots', 'garden', 'socket', ['onoff'], 'plug'),
        D('d13', 'Christmas lights', null, 'socket', ['onoff'], 'christmas-lights'),
        D('s1', 'Front door', 'hall', 'sensor', ['alarm_contact'], 'door'),
        D('s2', 'Hall motion', 'hall', 'sensor', ['alarm_motion'], 'motion-sensor'),
        D('s3', 'Kitchen motion', 'kitchen', 'sensor', ['alarm_motion'], 'motion-sensor'),
        D('s4', 'Smoke alarm', 'kitchen', 'sensor', ['alarm_smoke'], 'smoke-detector'),
        D('s5', 'Back door', 'kitchen', 'sensor', ['alarm_contact'], 'door'),
        D('t1', 'Living room thermostat', 'living', 'thermostat', ['target_temperature', 'measure_temperature'], 'thermostat'),
        D('t2', 'Bathroom floor', 'bath', 'thermostat', ['target_temperature'], 'thermostat'),
        D('m1', 'Meter', 'hall', 'sensor', ['measure_power'], 'socket'),
        D('l1', 'Front door lock', 'hall', 'lock', ['locked'], 'lock'),
        D('c1', 'Living room curtains', 'living', 'curtain', ['windowcoverings_set'], 'curtains'),
        D('c2', 'Bedroom blinds', 'bed', 'blinds', ['windowcoverings_set'], 'blinds'),
      ];
      const N = (title, units, value, decimals = null, extra = {}) => ({ title, type: 'number', units, decimals, min: null, max: null, values: null, value, ...extra });
      const B = (title, value) => ({ title, type: 'boolean', units: null, decimals: null, min: null, max: null, values: null, value });
      const READINGS = {
        onoff: B('Turned on', (d) => d.id.length % 2 === 0),
        dim: N('Brightness', '%', (d) => (d.id.charCodeAt(1) * 7 % 10) / 10, 2, { min: 0, max: 1 }),
        alarm_contact: B('Contact alarm', false),
        alarm_motion: B('Motion alarm', (d) => d.id === 's2'),
        alarm_smoke: B('Smoke alarm', false),
        target_temperature: N('Target temperature', '°C', 21, 1),
        measure_temperature: N('Temperature', '°C', 21.4, 1),
        measure_power: N('Power', 'W', 1342),
        locked: B('Locked', true),
        windowcoverings_set: N('Position', '%', 0.6, 2, { min: 0, max: 1 }),
      };
      const W = (type, settings = {}, deviceIds = []) => ({ id: Math.random().toString(36).slice(2, 10), type, title: '', settings, deviceIds });
      const dashboards = [
        { id: 'home', name: 'Home', theme: 'auto', columns: [[W('electricity'), W('price')], [W('lights', {}, ['d1', 'd2', 'd5', 'd8']), W('thermostat')], [W('weather'), W('timers'), W('locks')]] },
        { id: 'kitchen', name: 'Kitchen tablet', theme: 'dark', background: 'ocean', columns: [[W('timers'), W('media')], [W('flows'), W('sensordots'), W('values', { slot1: { id: 't1:measure_temperature', name: 'Living room thermostat · Temperature', description: 'Living room · °C' } })]] },
        { id: 'hall', name: 'Hallway', theme: 'auto', columns: [[W('locks'), W('cameras'), W('sensoralarms')]] },
        { id: 'new', name: 'Spare room', theme: 'auto', columns: [[], [], []] },
      ];

      mockWebApi({ lang, dashboards, zones, devices, readings: READINGS });
    })();
  </script>
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../settings/dashboard.js"></script>
</head>
<body>
  <div id="app" class="wd"></div>
  <script>
    mountWebDashboards(document.getElementById('app'));
  </script>
</body>
</html>
