<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/clock/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/clock/public/widget.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    /* The widget is transparent: it sits straight on the dashboard background. */
    .dash { padding: 0; box-sizing: border-box; }
    .light { background: #F2F3F5; padding: 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark</span><div class="dash homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · light</span><div class="dash light" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>358 px · dark · en-US (12 hours), snow</span><div class="dash homey-dark-mode" style="width:358px"><div id="w3"></div></div></div>
  <div class="col"><span>300 px · dark</span><div class="dash homey-dark-mode" style="width:300px"><div id="w4"></div></div></div>
  <div class="col"><span>270 px · dark · a long date</span><div class="dash homey-dark-mode" style="width:270px"><div id="w5"></div></div></div>
  <div class="col"><span>358 px · dark · weather off</span><div class="dash homey-dark-mode" style="width:358px"><div id="w6"></div></div></div>
  <div class="col"><span>358 px · dark · no location</span><div class="dash homey-dark-mode" style="width:358px"><div id="w7"></div></div></div>
  <div class="col"><span>358 px · light · no icon SVG (the file)</span><div class="dash light" style="width:358px"><div id="w8"></div></div></div>

  <script>
    // `?lang=de` sets Homey's language (the date); the clock is the browser's own and ticks on the minute.
    const LANG = new URLSearchParams(location.search).get('lang') || 'en';
    const ICONS = '../widgets/weather/public/icons/';
    const CLOUDY = { symbol: 'partlycloudy_day', temp: 12.4, high: 14.2, low: 7.6, icon: null };
    const SNOW = { symbol: 'lightsnow', temp: -3.2, high: -0.4, low: -8.1, icon: null };

    async function withIcon(w) {
      const res = await fetch(`${ICONS}${w.symbol}.svg`);
      return { ...w, icon: res.ok ? await res.text() : null };
    }
    function mount(id, weather, opts = {}, language = LANG) {
      const w = createClockWidget(document.getElementById(id), { locale: 'da-DK', iconBase: ICONS, ...opts });
      w.setState({ language, weather });
      return w;
    }
    (async () => {
      const cloudy = await withIcon(CLOUDY);
      mount('w1', cloudy);
      mount('w2', cloudy);
      mount('w3', await withIcon(SNOW), { locale: 'en-US' });
      mount('w4', cloudy);
      mount('w5', cloudy, {}, LANG === 'en' ? 'ru' : LANG);
      mount('w6', cloudy, { showWeather: false });
      mount('w7', { noLocation: true });
      mount('w8', CLOUDY);
    })();
  </script>
</body>
</html>
