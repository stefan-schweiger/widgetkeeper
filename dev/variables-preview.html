<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow variables widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/variables/public/widget.css">
  <script src="../widgets/variables/public/widget.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { background: #111217; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    /* The widget is transparent: it sits straight on the dashboard background. */
    .dash { padding: 0; box-sizing: border-box; }
    .light { background: #F2F3F5; padding: 12px; border-radius: 12px;
      --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col > span { color: #9C9DA5; font: 12px Roboto, sans-serif; }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · 1 column</span><div class="dash homey-dark-mode" style="width:358px"><div id="w1"></div></div></div>
  <div class="col"><span>358 px · light · 1 column</span><div class="dash light" style="width:358px"><div id="w2"></div></div></div>
  <div class="col"><span>358 px · dark · 2 columns</span><div class="dash homey-dark-mode" style="width:358px"><div id="w3"></div></div></div>
  <div class="col"><span>520 px (tablet) · dark · 2 columns</span><div class="dash homey-dark-mode" style="width:520px"><div id="w4"></div></div></div>
  <div class="col"><span>300 px · dark · 2 columns (falls back to 1)</span><div class="dash homey-dark-mode" style="width:300px"><div id="w5"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="dash homey-dark-mode" style="width:358px"><div id="w6"></div></div></div>

  <script>
    // Made-up variables; a simulated Homey that confirms each set after 300 ms (and fails "Broken flag").
    const vars = () => [
      { id: 'v1', name: 'Guest mode', type: 'boolean', value: true },
      { id: 'v2', name: 'Holiday · pause the morning and evening routines', type: 'boolean', value: false },
      { id: 'v3', name: 'Block the hallway motion lights', type: 'boolean', value: false },
      { id: 'v4', name: 'Night setpoint', type: 'number', value: 18 },
      { id: 'v5', name: 'Last arrival', type: 'string', value: 'Anna, 17:42' },
      { id: 'v6', name: 'Broken flag', type: 'boolean', value: false },
      { id: 'v7', missing: true },
    ];
    const widgets = [];
    function mount(id, opts = {}) {
      const w = createVariablesWidget(document.getElementById(id), {
        t: devT, step: 0.5, ...opts,
        onSet: (vid, value) => new Promise((resolve, reject) => setTimeout(() => {
          if (vid === 'v6') return reject(new Error('Simulated failure'));
          resolve();
          const v = vars().find(x => x.id === vid);
          for (const other of widgets) other.pushChange({ ...v, value });
        }, 300)),
      });
      w.setState(vars());
      widgets.push(w);
      return w;
    }
    mount('w1'); mount('w2');
    mount('w3', { columns: '2' }); mount('w4', { columns: '2' }); mount('w5', { columns: '2' });
    const empty = createVariablesWidget(document.getElementById('w6'), { t: devT });
    empty.setMessage(empty.t('selectSlots'));
  </script>
</body>
</html>
