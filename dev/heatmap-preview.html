<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heatmap widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/heatmap/public/widget.css">
  <script src="../widgets/heatmap/public/widget.js"></script>
  <script src="mock-heatmap.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { background: #111217; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    /* Homey's widget frame: 16px padding inside the dashboard tile. */
    .frame { padding: 16px; box-sizing: border-box; }
    .light { background: #FFFFFF; border-radius: 10px;
      --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col > span { color: #9C9DA5; font: 12px Roboto, sans-serif; }
  </style>
</head>
<body>
  <script>
    // ?today=2026-10-01&hour=14 moves "now"; ?lang=de translates; ?snap=/temp/heatmap-lux.json shows a real
    // /history response (`npm run diagnostics -- --json --heatmap <deviceId>:<capabilityId>`, its heatmapHistory).
    const q = new URLSearchParams(location.search);
    const today = q.get('today') || '2026-10-04';
    const hour = Number(q.get('hour') ?? 9);
    let snap = null;
    if (q.get('snap')) {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', q.get('snap'), false);
      xhr.send();
      snap = JSON.parse(xhr.responseText);
    }
    const cases = [
      ['358 px · dark · lux · this week · 2 h', 358, 'dark', 'lux', 'week', 2],
      ['358 px · dark · motion · last 7 days · 2 h', 358, 'dark', 'motion', 'rolling', 2],
      ['358 px · light · lux · this week · 1 h', 358, 'light', 'lux', 'week', 1],
      ['300 px · dark · lux · last 7 days · 3 h', 300, 'dark', 'lux', 'rolling', 3],
      ['300 px · dark · lux · this week · 1 h', 300, 'dark', 'lux', 'week', 1],
      ['358 px · dark · lux · no scale, no legend', 358, 'dark', 'lux', 'week', 2, false],
      ['358 px · dark · lux · last 3 days', 358, 'dark', 'lux', '3', 2],
      ['358 px · dark · lux · last 14 days', 358, 'dark', 'lux', '14', 2],
      ['358 px · dark · not set up', 358, 'dark', null, 'week', 2],
    ];
    for (const [label, width, theme, kind, period, step, extras = true] of cases) {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<span>${label}</span>`;
      const frame = document.createElement('div');
      frame.className = theme === 'dark' ? 'frame hm-frame homey-dark-mode' : 'frame light';
      frame.style.width = `${width}px`;
      const root = document.createElement('div');
      frame.appendChild(root);
      col.appendChild(frame);
      document.body.appendChild(col);
      const w = createHeatmapWidget(root, { t: devT, period, step, showScale: extras, showLegend: extras });
      if (!kind) w.setMessage(w.t('selectDevice'));
      // The app sends 14 days when more than 7 are shown.
      else w.setData(snap || (kind === 'lux' ? mockHeatmapLux(today, hour, heatmapPeriodDays(period) > 7 ? 14 : 7) : mockHeatmapMotion(today, hour)));
    }
  </script>
</body>
</html>
