<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget Previews</title>
<!--
  Source for the widget preview PNGs (from the "Widget Previews" Claude Design project).
  Without a query it shows them all on a canvas; `?p=elec-dark|elec-light|thermo-dark|thermo-light|qa-dark|qa-light|sa-dark|sa-light|weather-dark|weather-light|hm-dark|hm-light|cam-dark|cam-light|val-dark|val-light|lc-dark|lc-light`
  renders that one 1024×1024 frame alone on a transparent page, for scripts/render-previews.mjs.
-->
<style>
  body { margin: 0; background: #2A2B33; font-family: Roboto, -apple-system, system-ui, sans-serif; }
  .canvas { display: flex; flex-wrap: wrap; gap: 48px; padding: 48px; }
  .item { display: flex; flex-direction: column; gap: 12px; }
  .label { color: #EDEEF0; font-size: 20px; font-weight: 500; }
  .checker { background-size: 32px 32px; background-position: 0 0, 16px 16px; }
  .checker.dark { background-color: #16171C; background-image: linear-gradient(45deg,#1C1D23 25%,transparent 25%,transparent 75%,#1C1D23 75%), linear-gradient(45deg,#1C1D23 25%,transparent 25%,transparent 75%,#1C1D23 75%); }
  .checker.light { background-color: #E9EAEE; background-image: linear-gradient(45deg,#DFE0E5 25%,transparent 25%,transparent 75%,#DFE0E5 75%), linear-gradient(45deg,#DFE0E5 25%,transparent 25%,transparent 75%,#DFE0E5 75%); }
  .frame { width: 1024px; height: 1024px; display: flex; align-items: center; justify-content: center; }
  .card { width: 800px; border-radius: 48px; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; }
  .dark .card { background: #1F2029; box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
  .light .card { background: #FFFFFF; box-shadow: 0 12px 40px rgba(17,18,23,0.12); }
  .pill { border-radius: 999px; }
  svg { display: block; overflow: visible; }

  /* Single-frame mode */
  body.solo { background: transparent; }
  body.solo .canvas { padding: 0; gap: 0; }
  body.solo .label { display: none; }
  body.solo .checker { background: none; }
</style>
</head>
<body>
<section class="canvas" id="canvas"></section>
<script>
const W = 704;
const PB = [1.30,1.25,1.22,1.20,1.22,1.35,1.75,2.25,2.38,2.05,1.75,1.50,1.30,1.22,1.25,1.40,1.85,2.30,2.58,2.50,2.15,1.80,1.60,1.42];

function paths() {
  const H1 = 150, n = 48, live = [];
  for (let i = 0; i < n; i++) {
    let v = 0.22 + (Math.floor(i / 6) % 2 ? 0.08 : 0);
    if (i > 14 && i < 22) v = 0.85;
    if (i > 38) v = 0.5;
    live.push(v);
  }
  const lx = i => W * i / (n - 1), ly = v => H1 - 8 - (H1 - 16) * v;
  const liveLine = 'M' + live.map((v, i) => `${lx(i).toFixed(1)} ${ly(v).toFixed(1)}`).join('L');
  const H2 = 180, pmax = 2.7, sw = W / PB.length, py = p => H2 - 8 - (H2 - 16) * (p / pmax);
  let priceLine = `M0 ${py(PB[0]).toFixed(1)}`;
  PB.forEach((p, i) => { if (i) priceLine += `V${py(p).toFixed(1)}`; priceLine += `H${((i + 1) * sw).toFixed(1)}`; });
  const grid = (h, k) => Array.from({ length: k }, (_, j) => `M0 ${(h * (j + 1) / k).toFixed(1)}H${W}`).join('');
  return {
    liveLine, liveArea: liveLine + `L${W} ${H1}L0 ${H1}Z`,
    priceLine, priceArea: priceLine + `V${H2}H0Z`,
    grid1: grid(H1, 3), grid2: grid(H2, 3),
  };
}

const THEMES = {
  dark:  { fg: '#EDEEF0', muted: '#2C2D36', grid: '#2C2D36', green: '#71D51B', liveFill: 0.22, priceFill: 0.16, tile: '#2C2D36', tileText: '#464752' },
  light: { fg: '#1F2029', muted: '#E6E7EB', grid: '#EEEFF2', green: '#5DB80F', liveFill: 0.18, priceFill: 0.14, tile: '#F0F1F4', tileText: '#D5D6DC' },
};
const BLUE = '#2F8DF6', ORANGE = '#F2761E';
const pill = (w, h, bg, extra = '') => `<div class="pill" style="width:${w}px;height:${h}px;background:${bg};${extra}"></div>`;

function electricity(t) {
  const p = paths();
  return `<div class="card" style="gap:40px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
      <div style="display:flex;flex-direction:column;gap:14px">${pill(220, 44, t.green)}${pill(150, 24, t.muted)}</div>
      <div style="display:flex;flex-direction:column;gap:14px">${pill(240, 44, BLUE)}${pill(180, 24, t.muted)}</div>
    </div>
    <svg width="704" height="150" viewBox="0 0 704 150">
      <path d="${p.grid1}" fill="none" stroke="${t.grid}" stroke-width="3"/>
      <path d="${p.liveArea}" fill="${t.green}" fill-opacity="${t.liveFill}"/>
      <path d="${p.liveLine}" fill="none" stroke="${t.green}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <svg width="704" height="180" viewBox="0 0 704 180">
      <path d="${p.grid2}" fill="none" stroke="${t.grid}" stroke-width="3"/>
      <path d="${p.priceArea}" fill="${BLUE}" fill-opacity="${t.priceFill}"/>
      <path d="${p.priceLine}" fill="none" stroke="${BLUE}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:3px solid ${t.grid};padding-top:32px">
      ${pill(280, 24, t.muted)}${pill(130, 24, BLUE)}
    </div>
  </div>`;
}

function thermostat(t) {
  const tile = (radius, inner) => `<div style="flex:1;height:200px;background:${radius[1]};border-radius:${radius[0]};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">${inner}</div>`;
  return `<div class="card" style="gap:44px">
    <div style="display:flex;align-items:center;gap:32px">
      <div style="width:72px;height:84px;border:7px solid ${t.fg};border-radius:18px;box-sizing:border-box;flex:none"></div>
      <div style="display:flex;flex-direction:column;gap:14px">${pill(300, 36, t.fg)}${pill(200, 24, t.muted)}</div>
    </div>
    <div style="display:flex;gap:8px">
      ${tile(['44px 12px 12px 44px', t.tile], pill(96, 36, t.tileText))}
      ${tile(['12px', ORANGE], pill(110, 40, '#FFFFFF') + pill(130, 22, 'rgba(255,255,255,0.6)'))}
      ${tile(['12px 44px 44px 12px', t.tile], pill(110, 40, t.tileText) + pill(130, 22, ORANGE, 'opacity:0.7'))}
    </div>
  </div>`;
}

// Device Quick Actions is transparent: the tiles sit straight on the dashboard, with no card.
function quickActions(t, theme) {
  const tileBg = theme === 'dark' ? '#181920' : '#FFFFFF';
  const shadow = theme === 'dark' ? 'inset 0 2px 0 rgba(255,255,255,.06), 0 12px 40px rgba(0,0,0,.45)' : '0 12px 40px rgba(17,18,23,.12)';
  const tile = on => {
    // The default on-state: a blue-tinted tile with blue icons.
    const tint = theme === 'dark' ? '#1D3150' : '#DCEBFD', iconOn = theme === 'dark' ? '#5AA6FF' : BLUE;
    const fg = on ? iconOn : t.fg, bg = on ? tint : tileBg;
    return `<div style="height:200px;border-radius:32px;background:${bg};box-shadow:${shadow};padding:36px 32px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="width:56px;height:56px;border:7px solid ${fg};border-radius:14px;box-sizing:border-box"></div>
        <div style="width:40px;height:40px;border-radius:50%;border:7px solid ${on ? fg : t.tileText};box-sizing:border-box"></div>
      </div>
      ${pill(150, 30, t.fg, 'opacity:.85')}
    </div>`;
  };
  return `<div style="width:880px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
    ${[true, false, true, false, false, true].map(tile).join('')}
  </div>`;
}

// Device Values: Quick Actions' tiles with an icon and a value on top, the name below; an "on" boolean is tinted,
// and percentages fill the tile from the left in red, yellow or green (the widget's 45 % mix into the tile).
function deviceValues(t, theme) {
  const LEVEL = { red: '#F25F5C', yellow: '#F5C518', green: '#71D51B' };
  const tileBg = theme === 'dark' ? '#181920' : '#FFFFFF';
  const shadow = theme === 'dark' ? 'inset 0 2px 0 rgba(255,255,255,.06), 0 12px 40px rgba(0,0,0,.45)' : '0 12px 40px rgba(17,18,23,.12)';
  const tile = ([on, w, fill, level]) => {
    const tint = theme === 'dark' ? '#1D3150' : '#DCEBFD', iconOn = theme === 'dark' ? '#5AA6FF' : BLUE;
    const bg = on ? tint : fill != null
      ? `linear-gradient(to right, color-mix(in srgb, ${LEVEL[level]} 45%, ${tileBg}) ${fill}%, ${tileBg} ${fill}%)`
      : tileBg;
    return `<div style="height:200px;border-radius:32px;background:${bg};box-shadow:${shadow};padding:36px 32px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="width:28px;height:60px;border:7px solid ${on ? iconOn : t.fg};border-radius:14px;box-sizing:border-box"></div>
        ${pill(w, 36, t.fg)}
      </div>
      ${pill(150, 30, t.fg, 'opacity:.55')}
    </div>`;
  };
  return `<div style="width:880px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
    ${[[false, 120], [false, 90, 8, 'red'], [true, 70], [false, 90, 72, 'green'], [false, 90, 16, 'yellow'], [false, 100]].map(tile).join('')}
  </div>`;
}

// Light Controls: 2 tiles per row, each an icon and the brightness on top, the name, and a slider bar; a lit
// tile takes on the light's colour (warm amber, one in a cool white), fading towards the bottom.
function lightControls(t, theme) {
  const tileBg = theme === 'dark' ? '#181920' : '#FFFFFF';
  const shadow = theme === 'dark' ? 'inset 0 2px 0 rgba(255,255,255,.06), 0 12px 40px rgba(0,0,0,.45)' : '0 12px 40px rgba(17,18,23,.12)';
  const mix = theme === 'dark' ? 26 : 22;
  const tile = ([light, x]) => {
    const on = !!light;
    const bg = on ? `linear-gradient(to bottom, color-mix(in srgb, ${light} ${mix}%, ${tileBg}), color-mix(in srgb, ${light} ${mix / 2}%, ${tileBg}))` : tileBg;
    const track = theme === 'dark' ? '#2E2F37' : '#E6E7EA', muted = theme === 'dark' ? '#9C9DA5' : '#6B6C75';
    const fill = on ? `color-mix(in srgb, ${light} 85%, white)` : muted;
    return `<div style="height:240px;border-radius:32px;background:${bg};box-shadow:${shadow};padding:36px 36px 30px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="width:52px;height:52px;border:7px solid ${on ? t.fg : muted};border-radius:14px;box-sizing:border-box"></div>
        ${pill(on ? 90 : 70, 34, on ? t.fg : muted)}
      </div>
      ${pill(190, 30, t.fg, 'opacity:.85')}
      <div style="position:relative;height:40px">
        <div style="position:absolute;left:0;right:0;top:12px;height:16px;border-radius:8px;background:${track};overflow:hidden">
          <div style="width:${x}%;height:100%;background:${fill}"></div>
        </div>
        <div style="position:absolute;top:0;left:calc(${x / 100} * (100% - 40px));width:40px;height:40px;border-radius:50%;background:${on ? '#FFFFFF' : track};box-shadow:${on ? '0 2px 6px rgba(0,0,0,.35)' : 'none'}"></div>
      </div>
    </div>`;
  };
  const WARM = '#FFB054', COOL = '#D6E8FF';
  return `<div style="width:880px;display:grid;grid-template-columns:repeat(2,1fr);gap:32px">
    ${[[WARM, 35], [null, 0], [WARM, 80], [COOL, 60], [null, 0], [WARM, 20]].map(tile).join('')}
  </div>`;
}

// Sensor Alarms is transparent too: 2 tiles per row, each an icon, the name and the alarm text; an alarm turns it red.
function sensorAlarms(t, theme) {
  const tileBg = theme === 'dark' ? '#2B2C36' : '#FFFFFF';
  const shadow = theme === 'dark' ? '0 12px 40px rgba(0,0,0,.45)' : '0 12px 40px rgba(17,18,23,.12)';
  const RED = theme === 'dark' ? '#FF7B78' : '#D93B37', redTint = theme === 'dark' ? '#4A2E36' : '#FCE0DF';
  const tile = alarm => {
    const bg = alarm ? redTint : tileBg, icon = alarm ? RED : (theme === 'dark' ? '#9C9DA5' : '#6B6C75');
    return `<div style="height:150px;border-radius:32px;background:${bg};box-shadow:${shadow};padding:0 40px 0 32px;box-sizing:border-box;display:flex;align-items:center;gap:40px">
      <div style="width:56px;height:72px;border:7px solid ${icon};border-radius:14px;box-sizing:border-box;flex:none"></div>
      <div style="display:flex;flex-direction:column;gap:18px">${pill(200, 30, t.fg, 'opacity:.85')}${pill(alarm ? 170 : 130, 24, alarm ? RED : t.tileText)}</div>
    </div>`;
  };
  return `<div style="width:880px;display:grid;grid-template-columns:repeat(2,1fr);gap:32px">
    ${[false, true, false, false, false, false].map(tile).join('')}
  </div>`;
}

// Cameras: a 2×2 grid of 16:9 snapshot tiles (flat scenes), each with a name pill; one plays live.
function cameras(t, theme) {
  const shadow = theme === 'dark' ? '0 12px 40px rgba(0,0,0,.45)' : '0 12px 40px rgba(17,18,23,.12)';
  const scenes = [
    '<rect width="160" height="90" fill="#9FB8C9"/><rect y="50" width="160" height="40" fill="#6E7F5A"/><path d="M70 90L88 50h10l40 40Z" fill="#8C8A85"/><rect x="14" y="26" width="44" height="30" fill="#B9A58A"/><path d="M10 28L36 12l26 16Z" fill="#6B4E3D"/>',
    '<rect width="160" height="90" fill="#C9C1B4"/><rect y="76" width="160" height="14" fill="#8F8B84"/><rect x="62" y="16" width="36" height="60" fill="#2F4A3F"/><rect x="18" y="24" width="28" height="32" fill="#DCE6EC"/><rect x="114" y="24" width="28" height="32" fill="#DCE6EC"/>',
    '<rect width="160" height="90" fill="#B7CEDB"/><rect y="44" width="160" height="46" fill="#7A9A55"/><circle cx="32" cy="34" r="20" fill="#4E7340"/><circle cx="128" cy="30" r="24" fill="#5C8048"/><circle cx="74" cy="72" r="5" fill="#D9675B"/>',
    '<rect width="160" height="90" fill="#D8D0C4"/><rect y="62" width="160" height="28" fill="#A88B6C"/><rect x="96" y="14" width="50" height="34" fill="#9CB8CC"/><rect x="14" y="40" width="64" height="24" rx="5" fill="#56677A"/>',
  ];
  const tile = (scene, i) => `<div style="position:relative;aspect-ratio:16/9;border-radius:32px;overflow:hidden;box-shadow:${shadow}">
      <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">${scene}</svg>
      <div style="position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))"></div>
      <div style="position:absolute;left:28px;bottom:26px">${pill(150, 26, '#FFFFFF', 'opacity:.95')}</div>
      ${i === 2 ? `<div style="position:absolute;right:24px;bottom:22px;width:84px;height:34px;border-radius:10px;background:${theme === 'dark' ? '#F25F5C' : '#E5484D'}"></div>` : ''}
    </div>`;
  return `<div style="width:880px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px">${scenes.map(tile).join('')}</div>`;
}

// Weather Forecast: an hour strip (icon, temperature, precipitation, wind), fading out to the right.
function weather(t) {
  const YELLOW = '#FFC531', cloud = t.fg === '#EDEEF0' ? '#B9BAC2' : '#AEB0B8';
  const sun = '<circle cx="60" cy="60" r="30" fill="' + YELLOW + '"/>';
  const cloudPath = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M30 70a22 22 0 0 1 4-43.6A30 30 0 0 1 90 34a20 20 0 0 1 0 36Z" fill="${cloud}"/>`;
  const drops = '<path d="M38 100l-6 14M62 100l-6 14M86 100l-6 14" stroke="' + BLUE + '" stroke-width="8" stroke-linecap="round"/>';
  const icons = [
    sun,
    '<circle cx="46" cy="44" r="24" fill="' + YELLOW + '"/>' + cloudPath(14, 22, 0.95),
    cloudPath(4, 4, 1.05) + drops,
    cloudPath(4, 4, 1.05) + drops,
    '<circle cx="46" cy="44" r="24" fill="' + YELLOW + '"/>' + cloudPath(14, 22, 0.95),
  ];
  // The widget's temperature scale (widget.css): red when warm, the text colour when mild, blue when cold.
  const dark = t.fg === '#EDEEF0';
  const [warm, cold] = dark ? ['#FF6B70', '#5DB2FF'] : ['#C42335', '#1A6FC4'];
  const temps = [warm, warm, t.fg, cold, cold];
  const rain = [false, false, true, true, false];
  const col = (i, last) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;${last ? 'opacity:.35' : ''}">
      ${pill(i === 0 ? 96 : 64, 26, i === 0 ? t.fg : t.muted)}
      <svg width="120" height="120" viewBox="0 0 120 120">${icons[i]}</svg>
      ${pill(92, 40, temps[i])}
      ${rain[i] ? pill(100, 24, BLUE) : '<div style="height:24px"></div>'}
      ${pill(88, 24, t.muted)}
    </div>`;
  return `<div class="card" style="gap:44px">
    <div style="display:flex;gap:8px">${[0, 1, 2, 3, 4].map(i => col(i, i === 4)).join('')}</div>
    ${pill(260, 22, t.muted)}
  </div>`;
}

// Insights Heatmap: weekday rows of hour cells shaded from less to more, the rest of today hatched, and the scale.
function heatmap(t, theme) {
  const dark = theme === 'dark';
  const empty = dark ? '#2C2D36' : '#F0F1F4';
  const mix = k => `color-mix(in oklab, ${BLUE} ${k}%, ${empty})`;
  const shades = [mix(12), mix(32), mix(54), mix(77), BLUE];
  const hatch = `repeating-linear-gradient(135deg,transparent 0 9px,${dark ? '#3A3B45' : '#D5D6DC'} 9px 14px)`;
  // Daylight: dark nights, bright middays, a cloudy Wednesday.
  const LEVELS = [0, 0, 0, 0, 1, 3, 4, 4, 3, 1, 0, 0];
  const row = d => `<div style="display:flex;gap:10px;align-items:center">
      ${pill(52, 22, t.muted, 'border-radius:11px;flex:none')}
      <div style="flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:8px">
        ${LEVELS.map((l, h) => {
          if (d === 6 && h > 4) return `<div style="height:34px;border-radius:8px;background:${hatch};box-shadow:inset 0 0 0 2px ${dark ? '#34353F' : '#E2E3E8'}"></div>`;
          const lv = Math.max(0, d === 2 ? l - 1 : l);
          return `<div style="height:34px;border-radius:8px;background:${shades[lv]}"></div>`;
        }).join('')}
      </div>
    </div>`;
  return `<div class="card" style="gap:22px">
    <div style="display:flex;gap:28px;align-items:center;margin-bottom:14px">
      <div style="width:64px;height:64px;border:7px solid ${t.fg};border-radius:50%;box-sizing:border-box;flex:none"></div>
      <div style="display:flex;flex-direction:column;gap:14px">${pill(300, 30, t.fg, 'opacity:.85')}${pill(170, 22, t.muted)}</div>
    </div>
    ${[0, 1, 2, 3, 4, 5, 6].map(row).join('')}
    <div style="display:flex;gap:16px;align-items:center;margin-top:26px">
      ${pill(52, 20, t.muted)}
      <div style="flex:1;position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,${shades[0]},${shades[2]},${BLUE})">
        <div style="position:absolute;left:22%;top:-9px;width:12px;height:36px;border-radius:6px;background:${t.fg}"></div>
      </div>
      ${pill(70, 20, t.muted)}
    </div>
  </div>`;
}

const PREVIEWS = [
  { id: 'elec-dark',    label: '1a · Electricity Overview — preview-dark.png', theme: 'dark',  render: electricity },
  { id: 'elec-light',   label: '1b · Electricity Overview — preview-light.png', theme: 'light', render: electricity },
  { id: 'thermo-dark',  label: '1c · Thermostat Shortcuts — preview-dark.png',  theme: 'dark',  render: thermostat },
  { id: 'thermo-light', label: '1d · Thermostat Shortcuts — preview-light.png', theme: 'light', render: thermostat },
  { id: 'qa-dark',      label: '1e · Device Quick Actions — preview-dark.png',  theme: 'dark',  render: quickActions },
  { id: 'qa-light',     label: '1f · Device Quick Actions — preview-light.png', theme: 'light', render: quickActions },
  { id: 'sa-dark',      label: '1i · Sensor Alarms — preview-dark.png',          theme: 'dark',  render: sensorAlarms },
  { id: 'sa-light',     label: '1j · Sensor Alarms — preview-light.png',         theme: 'light', render: sensorAlarms },
  { id: 'weather-dark',  label: '1g · Weather Forecast — preview-dark.png',      theme: 'dark',  render: weather },
  { id: 'weather-light', label: '1h · Weather Forecast — preview-light.png',     theme: 'light', render: weather },
  { id: 'hm-dark',      label: '1k · Insights Heatmap — preview-dark.png',       theme: 'dark',  render: heatmap },
  { id: 'hm-light',     label: '1l · Insights Heatmap — preview-light.png',      theme: 'light', render: heatmap },
  { id: 'cam-dark',     label: '1m · Cameras — preview-dark.png',                theme: 'dark',  render: cameras },
  { id: 'cam-light',    label: '1n · Cameras — preview-light.png',               theme: 'light', render: cameras },
  { id: 'val-dark',     label: '1o · Device Values — preview-dark.png',          theme: 'dark',  render: deviceValues },
  { id: 'val-light',    label: '1p · Device Values — preview-light.png',         theme: 'light', render: deviceValues },
  { id: 'lc-dark',      label: '1q · Light Controls — preview-dark.png',         theme: 'dark',  render: lightControls },
  { id: 'lc-light',     label: '1r · Light Controls — preview-light.png',        theme: 'light', render: lightControls },
];

const solo = new URLSearchParams(location.search).get('p');
if (solo) document.body.classList.add('solo');
document.getElementById('canvas').innerHTML = PREVIEWS
  .filter(p => !solo || p.id === solo)
  .map(p => `<div class="item">
    <div class="label">${p.label}</div>
    <div class="checker ${p.theme}"><div class="frame" data-preview="${p.id}">${p.render(THEMES[p.theme], p.theme)}</div></div>
  </div>`).join('');
</script>
</body>
</html>
