<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather widget preview</title>
  <!--
    The Weather Forecast widget with mock data. Serve the repo root and open /dev/weather-preview.html.
    `?snap=/temp/met-compact.json` uses a real MET compact response; `?lang=de` uses locales/de.json.
    `?theme=vivid|temperature|sky|card` sets the theme of the first cards; the last rows show every theme,
    with the mock day and with a bland one (overcast, dry, 10-13°).
  -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/weather/public/widget.css">
  <script src="../widgets/weather/public/widget.js"></script>
  <script src="mock-util.js"></script>
  <script src="mock-weather.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { --homey-line-color-light: #EEEFF2; }
  </style>
</head>
<body>
  <div class="col"><span>358 px · compact (default)</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w1" data-density="compact"></div></div></div>
  <div class="col"><span>358 px · compact · two rows</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w2" data-density="compact" data-rows="2"></div></div></div>
  <div class="col"><span>358 px · detailed</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w3" data-density="detailed"></div></div></div>
  <div class="col"><span>358 px · detailed · two rows</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w4" data-density="detailed" data-rows="2"></div></div></div>
  <div class="col"><span>300 px · compact · light</span><div class="card light" style="width:300px"><div id="w5" data-density="compact"></div></div></div>
  <div class="col"><span>640 px · compact · two rows (tablet)</span><div class="card wf-frame homey-dark-mode" style="width:640px"><div id="w6" data-density="compact" data-rows="2"></div></div></div>
  <div class="col"><span>358 px · compact · every 2 hours</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w8" data-density="compact" data-step="2"></div></div></div>
  <div class="col"><span>358 px · detailed · every 3 hours</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w9" data-density="detailed" data-step="3"></div></div></div>
  <div class="col"><span>358 px · no location</span><div class="card wf-frame homey-dark-mode" style="width:358px"><div id="w7"></div></div></div>
  <div id="themes" style="display:contents"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') || 'en';
    const iconBase = '../widgets/weather/public/icons/';
    let hours = mockWeatherHours();
    const snap = params.get('snap');
    if (snap) {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', snap, false);
      xhr.send();
      hours = mockWeatherFromMet(JSON.parse(xhr.responseText));
    }
    const theme = params.get('theme') || undefined;
    for (const id of ['w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w8', 'w9']) {
      const root = document.getElementById(id);
      createWeatherWidget(root, { t: devT, iconBase, density: root.dataset.density, rows: root.dataset.rows, step: root.dataset.step, theme, frame: root.parentElement })
        .setForecast({ hours, language: lang });
    }

    // Every theme, dark and light, with the mock day and a bland one.
    const bland = hours.map((h, i) => ({ ...h, symbol: 'cloudy', temp: 10 + 3 * Math.sin(i / 4), precip: 0 }));
    const themesEl = document.getElementById('themes');
    for (const [label, data] of [['mock', hours], ['bland', bland]]) {
      for (const th of ['default', 'vivid', 'temperature', 'sky', 'card']) {
        for (const mode of ['dark', 'light']) {
          const col = document.createElement('div');
          col.className = 'col';
          col.innerHTML = `<span>${th} · ${mode} · ${label}</span><div class="card ${mode === 'dark' ? 'wf-frame homey-dark-mode' : 'wf-frame light'}" style="width:358px"><div></div></div>`;
          themesEl.appendChild(col);
          const root = col.querySelector('.card > div');
          createWeatherWidget(root, { t: devT, iconBase, theme: th, frame: root.parentElement }).setForecast({ hours: data, language: lang });
        }
      }
    }
    createWeatherWidget(document.getElementById('w7'), { t: devT, iconBase }).setForecast({ hours: [], noLocation: true, language: lang });
  </script>
</body>
</html>
