<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widget.css">
  <script src="widget.js"></script>
</head>
<body class="homey-widget hm-frame">
  <div id="root"></div>
  <script>
    const REFRESH_MS = 5 * 60e3; // the hour cells change at most hourly; keeps a recorded on/off value's request time fresh

    // Load marks for the app's diagnostics log, sent with the first request only.
    let perf = '';
    function loadMarks(sdkAt) {
      const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      return [Math.round(performance.timeOrigin), nav ? Math.round(nav.responseEnd) : -1,
        Math.round(sdkAt), Math.round(performance.now())].join(',');
    }
    function perfParam() {
      const p = perf ? `&perf=${perf}` : '';
      perf = '';
      return p;
    }

    // Homey's Android app already scales its type tokens by the system font scale (calc(1.1 * 14px)), and
    // the WebView's text zoom then scales all text again, so token text came out 1.21x where the native tiles
    // are 1.1x. Divide the tokens by the zoom (measured: a 100px font computes as 110px), so they render at
    // Homey's size. Fixed px sizes keep the zoom once, like the native text.
    function undoTextZoom() {
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px';
      document.body.appendChild(probe);
      const zoom = parseFloat(getComputedStyle(probe).fontSize) / 100;
      probe.remove();
      if (!(zoom > 0) || Math.abs(zoom - 1) < 0.01) return;
      const cs = getComputedStyle(document.body);
      for (const size of ['small', 'default', 'large', 'xlarge', 'xxlarge']) {
        for (const prop of ['font-size', 'line-height']) {
          const name = `--homey-${prop}-${size}`;
          const v = cs.getPropertyValue(name).trim();
          if (v) document.body.style.setProperty(name, `calc((${v}) / ${zoom})`);
        }
      }
    }

    function onHomeyReady(Homey) {
      undoTextZoom();
      perf = loadMarks(performance.now());
      const settings = Homey.getSettings() || {};
      const deviceId = (settings.device && settings.device.id) || null;
      const capabilityId = (settings.capability && settings.capability.id) || null;
      let readySent = false;
      let loaded = false;

      const widget = createHeatmapWidget(document.getElementById('root'), {
        t: (key, tokens) => Homey.__(key, tokens),
        period: settings.period,
        step: Number(settings.step) || 2,
        color: settings.color,
        showScale: settings.showScale !== false,
        showLegend: settings.showLegend !== false,
        // The widget reports its own height; Homey needs the body's, which adds the widget padding.
        onHeight: () => {
          if (!readySent) return;
          Homey.setHeight(bodyHeight());
        },
      });

      function bodyHeight() {
        return Math.ceil(document.body.getBoundingClientRect().height);
      }

      function ready() {
        if (readySent) return;
        readySent = true;
        Homey.ready({ height: bodyHeight() });
      }

      async function load() {
        if (!deviceId || !capabilityId) {
          widget.setMessage(widget.t('selectDevice'));
          ready();
          return;
        }
        try {
          widget.setData(await Homey.api('GET',
            `/history?deviceId=${encodeURIComponent(deviceId)}&capabilityId=${encodeURIComponent(capabilityId)}&days=${heatmapPeriodDays(settings.period)}${perfParam()}`));
          loaded = true;
        } catch (err) {
          console.error(err);
          // A failed refresh keeps the heatmap; only a failed first load replaces it with the error.
          widget.setMessage(widget.t('error'), loaded);
        }
        ready();
      }

      setInterval(load, REFRESH_MS);
      load();
    }
  </script>
</body>
</html>
