<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widget.css">
  <script src="widget.js"></script>
</head>
<body class="homey-widget-full">
  <div id="root"></div>
  <script>
    const REFRESH_MS = 5 * 60e3; // re-reads the devices (names, image and video ids)

    // Load marks for the app's diagnostics log, sent with the first request only.
    let perf = '';
    function loadMarks(sdkAt) {
      const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      return [Math.round(performance.timeOrigin), nav ? Math.round(nav.responseEnd) : -1,
        Math.round(sdkAt), Math.round(performance.now())].join(',');
    }
    function perfParam() {
      const p = perf ? `&perf=${perf}` : '';
      perf = '';
      return p;
    }

    // Homey's Android app scales the type tokens and the WebView zooms the text again; see Sensor Alarms.
    function undoTextZoom() {
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px';
      document.body.appendChild(probe);
      const zoom = parseFloat(getComputedStyle(probe).fontSize) / 100;
      probe.remove();
      if (!(zoom > 0) || Math.abs(zoom - 1) < 0.01) return;
      const cs = getComputedStyle(document.body);
      for (const size of ['small', 'default', 'large', 'xlarge', 'xxlarge']) {
        for (const prop of ['font-size', 'line-height']) {
          const name = `--homey-${prop}-${size}`;
          const v = cs.getPropertyValue(name).trim();
          if (v) document.body.style.setProperty(name, `calc((${v}) / ${zoom})`);
        }
      }
    }

    function onHomeyReady(Homey) {
      undoTextZoom();
      const sdkAt = performance.now();
      const settings = Homey.getSettings() || {};
      const snapshotMs = (Number(settings.refresh) || 10) * 1000;
      let deviceIds = [];
      let readySent = false;
      let loaded = false;
      let snapshotTimer = null;

      const widget = createCamerasWidget(document.getElementById('root'), {
        t: (key, tokens) => Homey.__(key, tokens),
        refreshMs: snapshotMs,
        api: (method, path, body) => Homey.api(method, path, body),
        report: (text) => { Homey.api('POST', '/report', { text }).catch(() => {}); },
        onHeight: () => {
          if (!readySent) return;
          Homey.setHeight(bodyHeight());
        },
      });

      function bodyHeight() {
        return Math.ceil(document.body.getBoundingClientRect().height);
      }

      let readyStarted = false;
      async function ready() {
        if (readyStarted) return;
        readyStarted = true;
        if (document.fonts && document.fonts.ready) {
          await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1000))]);
        }
        readySent = true;
        Homey.ready({ height: bodyHeight() });
      }

      // Snapshots refresh on their own timer, and not while the dashboard is in the background.
      function startSnapshots() {
        if (snapshotTimer || document.hidden || !loaded) return;
        widget.refresh();
        snapshotTimer = setInterval(() => widget.refresh(), snapshotMs);
      }
      function stopSnapshots() {
        if (snapshotTimer) clearInterval(snapshotTimer);
        snapshotTimer = null;
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { stopSnapshots(); widget.pause(); } else startSnapshots();
      });

      async function load() {
        if (!deviceIds.length) {
          widget.setMessage(widget.t('selectDevices'));
          ready();
          return;
        }
        try {
          widget.setState(await Homey.api('GET', `/state?deviceIds=${deviceIds.map(encodeURIComponent).join(',')}${perfParam()}`));
          loaded = true;
          startSnapshots();
        } catch (err) {
          console.error(err);
          // A failed refresh keeps the tiles; only a failed first load replaces them with the error.
          widget.setMessage(widget.t('error'), loaded);
        }
        ready();
      }

      Promise.resolve(typeof Homey.getDeviceIds === 'function' ? Homey.getDeviceIds() : [])
        .then((ids) => { deviceIds = Array.isArray(ids) ? ids : []; })
        .catch(() => { deviceIds = []; })
        .then(() => {
          perf = loadMarks(sdkAt);
          setInterval(load, REFRESH_MS);
          load();
        });
    }
  </script>
</body>
</html>
