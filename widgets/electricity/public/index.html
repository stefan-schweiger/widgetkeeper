<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widget.css">
  <script src="widget.js"></script>
</head>
<body class="homey-widget">
  <div id="root"></div>
  <script>
    const REFRESH_MS = 5 * 60e3; // usage history resolution; also keeps the app's meter subscription alive

    // Load marks for the app's diagnostics log, sent with the first request only.
    let perf = '';
    function loadMarks(sdkAt) {
      const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      return [Math.round(performance.timeOrigin), nav ? Math.round(nav.responseEnd) : -1,
        Math.round(sdkAt), Math.round(performance.now())].join(',');
    }
    function perfParam() {
      const p = perf ? `&perf=${perf}` : '';
      perf = '';
      return p;
    }

    // Homey's Android app already scales its type tokens by the system font scale (calc(1.1 * 14px)), and
    // the WebView's text zoom then scales all text again, so token text came out 1.21x where the native tiles
    // are 1.1x. Divide the tokens by the zoom (measured: a 100px font computes as 110px), so they render at
    // Homey's size. Fixed px sizes keep the zoom once, like the native text.
    function undoTextZoom() {
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px';
      document.body.appendChild(probe);
      const zoom = parseFloat(getComputedStyle(probe).fontSize) / 100;
      probe.remove();
      if (!(zoom > 0) || Math.abs(zoom - 1) < 0.01) return;
      const cs = getComputedStyle(document.body);
      for (const size of ['small', 'default', 'large', 'xlarge', 'xxlarge']) {
        for (const prop of ['font-size', 'line-height']) {
          const name = `--homey-${prop}-${size}`;
          const v = cs.getPropertyValue(name).trim();
          if (v) document.body.style.setProperty(name, `calc((${v}) / ${zoom})`);
        }
      }
    }

    function onHomeyReady(Homey) {
      undoTextZoom();
      const sdkAt = performance.now();
      const settings = Homey.getSettings() || {};
      let deviceId = null;
      let readySent = false;
      let loaded = false;

      const widget = createElectricityWidget(document.getElementById('root'), {
        t: (key, tokens) => Homey.__(key, tokens),
        onHeight: (h) => {
          if (!readySent) return;
          Homey.setHeight(h);
        },
      });
      widget.setSettings({
        showUsage: settings.showUsage !== false,
        nextLow: settings.nextLow || (settings.showNextLow === false ? 'none' : '12'), // showNextLow: pre-dropdown setting
        separateUsage: settings.separateUsage === true,
        liveWindow: Number(settings.liveWindow) || 10,
        smooth: settings.smooth === true,
        usageColor: settings.usageColor === 'purple' ? 'purple' : 'neutral',
      });

      function ready() {
        if (readySent) return;
        readySent = true;
        Homey.ready({ height: Math.ceil(document.body.getBoundingClientRect().height) });
      }

      async function load() {
        try {
          const snapshot = await Homey.api('GET', `/snapshot?deviceId=${encodeURIComponent(deviceId || '')}${perfParam()}`);
          // Without readings (or with a meter error) the prices still show; the widget notes the meter.
          if (!deviceId) widget.setMessage(widget.t('selectMeter'));
          else {
            widget.setData(snapshot);
            loaded = true;
          }
        } catch (err) {
          console.error(err);
          // A failed refresh keeps the last snapshot (the live readings still arrive); only a failed first load shows the error.
          if (!loaded) widget.setMessage(widget.t('error'));
        }
        ready();
      }

      Homey.on('electricity:live', (data) => {
        if (data && data.deviceId === deviceId) widget.pushLive(data);
      });

      // Minute tick: "minutes remaining" countdown. Hour boundary and every 5 min: fresh snapshot.
      let lastHour = new Date().getHours();
      let lastLoad = Date.now();
      setInterval(() => {
        const now = new Date();
        if (now.getHours() !== lastHour || Date.now() - lastLoad >= REFRESH_MS) {
          lastHour = now.getHours();
          lastLoad = Date.now();
          load();
        } else {
          widget.render();
        }
      }, 60e3);

      Promise.resolve(typeof Homey.getDeviceIds === 'function' ? Homey.getDeviceIds() : [])
        .then((ids) => { deviceId = (ids && ids[0]) || null; })
        .catch(() => { deviceId = null; })
        .then(() => { perf = loadMarks(sdkAt); load(); });
    }
  </script>
</body>
</html>
