<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Popup</title>
  <!--
    A Flow's popup (wk-084), opened by a Popups widget on a Homey dashboard in the phone app's in-app browser
    (`Homey.popup()`): #id=<popup id>&t=<its token>. No login: the token lets it read and answer that one popup through
    the app's public routes (`POST /popup/:id`, `/image`, `/answer`).
  -->
  <link rel="stylesheet" href="popup.css">
  <script src="../widgets/spacer/kit.js"></script>
  <script src="popup.js"></script>
</head>
<body>
  <main id="app" class="pp"></main>
  <script>
    mountPopupPage(document.getElementById('app'));
  </script>
</body>
</html>
