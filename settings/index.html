<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .row > * { flex: 1 1 auto; }
    #report {
      width: 100%; box-sizing: border-box; height: 60vh; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre; overflow: auto; resize: vertical;
    }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="varTitle">API key</legend>
    <p class="homey-form-help" data-i18n="varHelp"></p>
    <div class="homey-form-group">
      <label class="homey-form-label" for="varKey" data-i18n="varKey">API key</label>
      <input class="homey-form-input" id="varKey" type="password" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <button class="homey-button-primary-shadow" id="varSave" data-i18n="varSave">Save</button>
      <button class="homey-button-secondary-shadow" id="varRemove" data-i18n="varRemove">Remove</button>
    </div>
    <p class="homey-form-help" id="varStatus"></p>
  </fieldset>

  <header class="homey-header">
    <h2 class="homey-title" data-i18n="title">Diagnostics</h2>
    <p class="homey-subtitle" data-i18n="subtitle"></p>
  </header>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="device" data-i18n="includeDevice">Include device details</label>
      <select class="homey-form-select" id="device"><option value="" data-i18n="none">None</option></select>
    </div>
  </fieldset>

  <div class="row">
    <button class="homey-button-secondary-shadow" id="refresh" data-i18n="refresh">Refresh</button>
    <button class="homey-button-primary-shadow" id="copy" data-i18n="copy">Copy</button>
    <button class="homey-button-secondary-shadow" id="share" style="display:none" data-i18n="share">Share</button>
  </div>
  <p class="homey-form-help" id="status"></p>
  <textarea id="report" readonly></textarea>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const select = document.getElementById('device');
      const report = document.getElementById('report');
      const status = document.getElementById('status');
      let devicesListed = false;
      const t = (key, tokens) => Homey.__(`settings.${key}`, tokens);
      for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.dataset.i18n);

      function load() {
        status.textContent = t('loading');
        const device = select.value;
        Homey.api('GET', `/diagnostics${device ? `?device=${encodeURIComponent(device)}` : ''}`, null, (err, result) => {
          if (err) {
            status.textContent = t('loadFailed', { error: err.message || err });
            return;
          }
          if (!devicesListed && Array.isArray(result.devices)) {
            devicesListed = true;
            for (const d of result.devices) {
              const o = document.createElement('option');
              o.value = d.id;
              o.textContent = d.name;
              select.appendChild(o);
            }
          }
          report.value = JSON.stringify(result, null, 2);
          status.textContent = t('updated', { time: new Date().toLocaleTimeString() });
        });
      }

      async function copy() {
        try {
          await navigator.clipboard.writeText(report.value);
        } catch (e) {
          // The Homey app's web view may not allow the async clipboard.
          report.focus();
          report.select();
          document.execCommand('copy');
        }
        status.textContent = t('copied');
      }

      const share = document.getElementById('share');
      if (navigator.share) {
        share.style.display = '';
        share.addEventListener('click', () => {
          navigator.share({ title: t('shareTitle'), text: report.value }).catch(() => {});
        });
      }

      // The personal API key (Flow Variables, Flow Buttons, Media and the Smart Stack): checked by the app before it's saved, and never sent back.
      const varKey = document.getElementById('varKey');
      const varStatus = document.getElementById('varStatus');
      function showKeyState() {
        Homey.api('GET', '/variables-key', null, (err, res) => {
          if (!err) varStatus.textContent = t(res && res.set ? 'varIsSet' : 'varNotSet');
        });
      }
      function saveKey(key) {
        varStatus.textContent = t('varChecking');
        Homey.api('PUT', '/variables-key', { key }, (err, res) => {
          if (err) { varStatus.textContent = err.message || String(err); return; }
          if (res && res.ok) {
            varKey.value = '';
            // A key may allow only some of it (the answer says what): variables, flows, dashboards (the Smart Stack).
            if (!key) varStatus.textContent = t('varRemoved');
            else if (!res.variables && !res.flows) varStatus.textContent = t('varSavedDashboards');
            else {
              const saved = !res.variables ? 'varSavedFlows' : !res.flows ? 'varSavedVariables' : 'varSaved';
              varStatus.textContent = `${t(saved)} ${t(res.dashboards ? 'varDashboards' : 'varNoDashboards')}`;
            }
          } else {
            varStatus.textContent = t(res && res.reason === 'keyScope' ? 'varKeyScope' : 'varKeyInvalid');
          }
        });
      }
      document.getElementById('varSave').addEventListener('click', () => { if (varKey.value.trim()) saveKey(varKey.value.trim()); });
      document.getElementById('varRemove').addEventListener('click', () => saveKey(''));
      showKeyState();

      select.addEventListener('change', load);
      document.getElementById('refresh').addEventListener('click', load);
      document.getElementById('copy').addEventListener('click', copy);
      load();
      Homey.ready();
    }
  </script>
</body>
</html>
